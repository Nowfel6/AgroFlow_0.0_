<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Sale - AgroFlow</title>
    <!-- Your CSS links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* Your full CSS from other pages */
   :root {
          --primary-color: #1e5631;
          --secondary-color: #4c9f70;
          --accent-color: #d4a017;
          --background-color: #f8f9fa;
          --card-color: #ffffff;
          --text-color: #333333;
          --light-text: #6c757d;
          --border-color: #dee2e6;
        }
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body {
          font-family: "Nunito", sans-serif;
          background-color: var(--background-color);
          color: var(--text-color);
          line-height: 1.6;
        }
        .header { background-color: var(--primary-color); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; font-size: 1.5rem; font-weight: 700; }
        .user-info { display: flex; align-items: center; }
         .user-profile {
        display: flex;
        align-items: center;
        cursor: pointer;
      }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        .horizontal-nav { background-color: white; padding: 0 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: center; }
        .nav-item { padding: 15px 20px; font-weight: 600; }
        .main-content { padding: 30px; }
        .form-section { background-color: #fff; border-radius: 12px; padding: 30px; max-width: 900px; margin: auto; }
        .section-header h2 { color: var(--primary-color); font-size: 1.6rem; }
        .request-sale-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 30px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 1rem; }
        #bankDetailsContainer { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 30px; }
        #onlinePaymentContainer { grid-column: 1 / -1; }
        .form-actions { grid-column: 1 / -1; text-align: right; margin-top: 20px; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 700; }
    </style>
</head>
<body>
<div class="header">
    <div class="logo"><i class="fas fa-leaf"></i> <span>AgroFlow</span></div>
    <div class="user-info">
        <div class="user-profile">
            <img  src="/images/avatar-659651_1280.png" alt="Officer" />
            <span id="userName">Loading...</span>
        </div>
    </div>
</div>
<div class="horizontal-nav">
    <div class="nav-items">
        <div class="nav-item">
            <a href="farmer-profile.html"><i class="fas fa-arrow-left"></i> Back to Farmer Profile</a>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="form-section">
        <div class="section-header">
            <h2 id="formHeader"><i class="fas fa-balance-scale"></i> Request Sale</h2>
        </div>
        <form class="request-sale-form" id="requestSaleForm">
            <!-- These field IDs MUST match your SaleRequest.java entity fields -->
            <div class="form-group">
                <label for="quantity_requested">Quantity for Sale (kg)</label>
                <input type="number" step="0.01" id="quantity_requested" required />
            </div>
            <div class="form-group">
                <label for="price_per_kg_requested">Price per kg </label>
                <input type="number" step="0.01" id="price_per_kg_requested" placeholder="e.g., 55.50" required />
            </div>
            <div class="form-group">
                <label for="delivery_status">Delivery Status</label>
                <select id="delivery_status" required>
                    <option value="Pending">Pending</option>
                    <option value="In Transit">In Transit</option>
                    <option value="Delivered">Delivered</option>
                </select>
            </div>
            <div class="form-group">
                <label for="payment_mode_requested">Payment Mode</label>
                <select id="payment_mode_requested" required>
                    <option value="" disabled selected>Select a payment mode</option>
                    <option value="Cash">Cash</option>
                    <option value="Bank Account">Bank Account</option>
                    <option value="Online/Mobile">Online/Mobile</option>
                </select>
            </div>
            <div id="bankDetailsContainer" style="display: none;">
                <div class="form-group"><label for="bank_name">Bank Name</label><input type="text" id="bank_name" /></div>
                <div class="form-group"><label for="account_holder_name">Account Holder Name</label><input type="text" id="account_holder_name" /></div>
                <div class="form-group"><label for="account_number">Account Number</label><input type="text" id="account_number" /></div>
                <div class="form-group"><label for="ifsc_code">Routing Number</label><input type="text" id="ifsc_code" /></div>
            </div>
            <div id="onlinePaymentContainer" style="display: none;">
                <div class="form-group"><label for="online_banking_no">Mobile Number</label><input type="tel" id="online_banking_no" /></div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Submit Sale Request</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- 1. HANDLE LOGIN STATE & GET IDs ---
        const officerString = sessionStorage.getItem('loggedInOfficer');
        let loggedInOfficer = null;
        if (officerString) {
            loggedInOfficer = JSON.parse(officerString);
            document.getElementById('userName').textContent = loggedInOfficer.name;
        } else {
            alert("You are not logged in.");
            window.location.href = 'login.html';
            return;
        }

        const selectedFarmerId = sessionStorage.getItem('selectedFarmerId');
        const selectedHarvestId = sessionStorage.getItem('selectedHarvestId');

        if (!selectedFarmerId || !selectedHarvestId) {
            alert("Required farmer or harvest information is missing. Returning to profile.");
            window.location.href = 'farmer-profile.html';
            return;
        }

        // --- 2. DYNAMIC UI & FORM LOGIC ---
        const paymentModeSelect = document.getElementById("payment_mode_requested");
        const bankDetailsContainer = document.getElementById("bankDetailsContainer");
        const onlinePaymentContainer = document.getElementById("onlinePaymentContainer");

        paymentModeSelect.addEventListener("change", function () {
            const selectedMode = this.value;
            bankDetailsContainer.style.display = (selectedMode === "Bank Account") ? "grid" : "none";
            onlinePaymentContainer.style.display = (selectedMode === "Online/Mobile") ? "block" : "none";
        });

        // --- 3. FORM SUBMISSION HANDLER ---
        const requestSaleForm = document.getElementById("requestSaleForm");
        requestSaleForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            // Build the SaleRequest object from form data
            const saleRequestData = {
                quantity_requested: document.getElementById('quantity_requested').value,
                price_per_kg_requested: document.getElementById('price_per_kg_requested').value,
                delivery_status: document.getElementById('delivery_status').value,
                payment_mode_requested: document.getElementById('payment_mode_requested').value,
                bank_name: document.getElementById('bank_name').value,
                account_holder_name: document.getElementById('account_holder_name').value,
                account_number: document.getElementById('account_number').value,
                ifsc_code: document.getElementById('ifsc_code').value,
                online_banking_no: document.getElementById('online_banking_no').value
            };

            const url = `/api/salerequests/create?farmerId=${selectedFarmerId}&officerId=${loggedInOfficer.id}&harvestId=${selectedHarvestId}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(saleRequestData)
                });

                if (response.ok) {
                    alert("Sale request has been submitted successfully!");
                    sessionStorage.setItem('profileNeedsRefresh', 'true'); // Set refresh flag
                    window.location.href = "farmer-profile.html";
                } else {
                    const errorMessage = await response.text();
                    alert(`Failed to submit request: ${errorMessage}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while submitting the request.');
            }
        });
    });
</script>
</body>
</html>
