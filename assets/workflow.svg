<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" role="img" aria-label="AgroFlow farm-to-market approval workflow">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#0b3d2e"/>
    </linearGradient>
  </defs>
  <rect width="920" height="250" rx="14" fill="url(#wbg)"/>
  <text x="460" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#d1fae5">Farm-to-Market Approval Workflow</text>

  <!-- arrows between nodes -->
  <g stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="176" y1="140" x2="206" y2="140"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></line>
    <line x1="361" y1="140" x2="391" y2="140"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="0.8s" repeatCount="indefinite"/></line>
    <line x1="546" y1="140" x2="576" y2="140"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="1.6s" repeatCount="indefinite"/></line>
    <line x1="731" y1="140" x2="761" y2="140"><animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="4s" begin="2.4s" repeatCount="indefinite"/></line>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- travelling data dot along the whole chain -->
  <circle r="5" fill="#fef08a">
    <animateMotion dur="4s" repeatCount="indefinite" path="M95 140 L 838 140"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- step nodes (highlight in sequence) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="20" y="105" width="156" height="70" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#4ade80" stroke-width="1.5">
        <animate attributeName="stroke" values="#4ade80;#fde047;#4ade80" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="98" y="134" font-size="19" fill="#a7f3d0">&#127793;</text>
      <text x="98" y="156" font-size="13.5" font-weight="600" fill="#ecfdf5">Crop Plan</text>
      <text x="98" y="169" font-size="10.5" fill="#86efac">planned &#183; tracked</text>
    </g>
    <g>
      <rect x="206" y="105" width="155" height="70" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#4ade80" stroke-width="1.5">
        <animate attributeName="stroke" values="#4ade80;#fde047;#4ade80" dur="4s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="4s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="283" y="134" font-size="19" fill="#a7f3d0">&#127807;</text>
      <text x="283" y="156" font-size="13.5" font-weight="600" fill="#ecfdf5">Harvest</text>
      <text x="283" y="169" font-size="10.5" fill="#86efac">quantity recorded</text>
    </g>
    <g>
      <rect x="391" y="105" width="155" height="70" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#4ade80" stroke-width="1.5">
        <animate attributeName="stroke" values="#4ade80;#fde047;#4ade80" dur="4s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="4s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="468" y="134" font-size="19" fill="#a7f3d0">&#128230;</text>
      <text x="468" y="156" font-size="13.5" font-weight="600" fill="#ecfdf5">Sale Request</text>
      <text x="468" y="169" font-size="10.5" fill="#86efac">qty &#183; price/kg &#183; bank</text>
    </g>
    <g>
      <rect x="576" y="105" width="155" height="70" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#4ade80" stroke-width="1.5">
        <animate attributeName="stroke" values="#4ade80;#fde047;#4ade80" dur="4s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="4s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="653" y="134" font-size="19" fill="#a7f3d0">&#9989;</text>
      <text x="653" y="156" font-size="13.5" font-weight="600" fill="#ecfdf5">Approval</text>
      <text x="653" y="169" font-size="10.5" fill="#86efac">vs market price</text>
    </g>
    <g>
      <rect x="761" y="105" width="139" height="70" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#fbbf24" stroke-width="1.5">
        <animate attributeName="stroke" values="#fbbf24;#ffffff;#fbbf24" dur="4s" begin="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-width" values="1.5;3;1.5" dur="4s" begin="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="830" y="134" font-size="19" fill="#fde68a">&#127974;</text>
      <text x="830" y="156" font-size="13.5" font-weight="600" fill="#fef9c3">Payment</text>
      <text x="830" y="169" font-size="10.5" fill="#fde68a">bank transfer</text>
    </g>
  </g>

  <!-- footer strip -->
  <text x="460" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6ee7b7">POST /api/salerequests/create &#8594; GET /api/salerequests/officer/{id} &#8594; POST /api/sales/approve</text>
</svg>
