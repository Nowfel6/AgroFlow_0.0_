<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Farmer Profile - AgroFlow</title>
    <!-- Your CSS and Font links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* Copy the full CSS from your register-farmer.html page here */
        :root {
          --primary-color: #1e5631;
          --secondary-color: #4c9f70;
          --accent-color: #d4a017;
          --background-color: #f8f9fa;
          --card-color: #ffffff;
          --text-color: #333333;
          --light-text: #6c757d;
          --border-color: #dee2e6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background-color: #f8f9fa; }
        .header { background-color: var(--primary-color); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 700; }
        .user-info { display: flex; align-items: center; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        .horizontal-nav { background-color: white; padding: 0 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: center; }
        .nav-item { padding: 15px 20px; font-weight: 600; }
        .main-content { padding: 30px; }
        .form-section { background-color: #fff; border-radius: 12px; padding: 30px; max-width: 900px; margin: auto; }
        .section-header h2 { color: var(--primary-color); }
        .edit-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 30px; }
        .form-group label { font-weight: 600; margin-bottom: 8px; display: block; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 1rem; }
        .form-actions { grid-column: 1 / -1; text-align: right; margin-top: 20px; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 700; }
    </style>
</head>
<body>
<div class="header">
    <div class="logo"><i class="fas fa-leaf"></i> <span>AgroFlow</span></div>
    <div class="user-info">
        <div class="user-profile">
            <img src="/images/avatar-659651_1280.png" alt="Officer" />
            <span id="userName">Loading...</span>
        </div>
    </div>
</div>
<div class="horizontal-nav">
    <div class="nav-items">
        <div class="nav-item"><a href="farmer-profile.html"><i class="fas fa-arrow-left"></i> Back to Farmer Profile</a></div>
    </div>
</div>

<div class="main-content">
    <div class="form-section">
        <div class="section-header">
            <h2><i class="fas fa-user-edit"></i> Edit Farmer Profile</h2>
        </div>
        <form id="editFarmerForm" class="edit-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" required>
            </div>
            <div class="form-group">
                <label for="nid">National ID (NID)</label>
                <input type="text" id="nid" required>
            </div>
            <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district" required>
            </div>
            <div class="form-group">
                <label for="union_name">Union</label>
                <input type="text" id="union_name" required>
            </div>
            <div class="form-group">
                <label for="village">Village</label>
                <input type="text" id="village" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Update Farmer</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        // --- 1. LOGIN & CONTEXT CHECK ---
        const officerString = sessionStorage.getItem('loggedInOfficer');
        if (officerString) {
            document.getElementById('userName').textContent = JSON.parse(officerString).name;
        } else {
            alert("You are not logged in.");
            window.location.href = 'login.html';
            return;
        }

        const selectedFarmerId = sessionStorage.getItem('selectedFarmerId');
        if (!selectedFarmerId) {
            alert("No farmer selected. Returning to list.");
            window.location.href = 'farmer-dashboard.html';
            return;
        }

        // --- 2. FETCH EXISTING FARMER DATA TO POPULATE FORM ---
        try {
            // We can reuse the profile DTO endpoint as it has all the needed info
            const response = await fetch(`/api/farmers/${selectedFarmerId}/profile`);
            const profile = await response.json();

            // Populate the form with the farmer's current data
            document.getElementById('name').value = profile.name;
            document.getElementById('contact').value = profile.contact;
            document.getElementById('nid').value = profile.nid;
            document.getElementById('district').value = profile.district;
            document.getElementById('union_name').value = profile.union_name;
            document.getElementById('village').value = profile.village;

        } catch (error) {
            console.error("Failed to load farmer data:", error);
            alert("Could not load farmer data for editing.");
        }

        // --- 3. FORM SUBMISSION HANDLER ---
        const editFarmerForm = document.getElementById('editFarmerForm');
        editFarmerForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            // Build the DTO object for the update
            const updateData = {
                name: document.getElementById('name').value,
                contact: document.getElementById('contact').value,
                nid: document.getElementById('nid').value,
                district: document.getElementById('district').value,
                union_name: document.getElementById('union_name').value,
                village: document.getElementById('village').value
            };

            try {
                const response = await fetch(`/api/farmers/${selectedFarmerId}/update`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    alert("Farmer profile updated successfully!");
                    sessionStorage.setItem('profileNeedsRefresh', 'true'); // Flag for profile page
                    window.location.href = 'farmer-profile.html';
                } else {
                    const errorMessage = await response.text();
                    alert(`Update failed: ${errorMessage}`);
                }
            } catch (error) {
                console.error("Failed to update farmer:", error);
                alert("An error occurred during the update.");
            }
        });
    });
</script>
</body>
</html>
