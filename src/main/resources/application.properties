spring.application.name=agroflow_noppo

# --- Database credentials are NOT stored in this repository ---
# Option 1 (recommended for local dev): create `application-local.properties`
#   in the project root (it is gitignored) with your real username/password.
# Option 2: set environment variables DB_URL / DB_USERNAME / DB_PASSWORD.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/final_agroflow?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

