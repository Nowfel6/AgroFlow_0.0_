<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Record Harvest - AgroFlow</title>
    <!-- Your CSS links -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* Your full CSS from other pages */
       :root {
          --primary-color: #1e5631;
          --secondary-color: #4c9f70;
          --accent-color: #d4a017;
          --background-color: #f8f9fa;
          --card-color: #ffffff;
          --text-color: #333333;
          --light-text: #6c757d;
          --border-color: #dee2e6;
        }
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body {
          font-family: "Nunito", sans-serif;
          background-color: var(--background-color);
          color: var(--text-color);
          line-height: 1.6;
        }
        .header { background-color: var(--primary-color); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; font-size: 1.5rem; font-weight: 700; }
        .user-info { display: flex; align-items: center; }
         .user-profile {
        display: flex;
        align-items: center;
        cursor: pointer;
      }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; }
        .horizontal-nav { background-color: white; padding: 0 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: center; }
        .nav-item { padding: 15px 20px; font-weight: 600; }
        .main-content { padding: 30px; }
        .form-section { background-color: #fff; border-radius: 12px; padding: 30px; max-width: 900px; margin: auto; }
        .section-header h2 { color: var(--primary-color); font-size: 1.6rem; }
        .record-harvest-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 30px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 1rem; }
        .form-actions { grid-column: 1 / -1; text-align: right; margin-top: 20px; }
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 700; }
    </style>
</head>
<body>
<div class="header">
    <div class="logo"><i class="fas fa-leaf"></i> <span>AgroFlow</span></div>
    <div class="user-info">
        <div class="user-profile">
            <img  src="/images/avatar-659651_1280.png" alt="Officer" />
            <span id="userName">Loading...</span>
        </div>
    </div>
</div>
<div class="horizontal-nav">
    <div class="nav-items">
        <div class="nav-item">
            <a href="farmer-profile.html"><i class="fas fa-arrow-left"></i> Back to Farmer Profile</a>
        </div>
    </div>
</div>

<div class="main-content">
    <div class="form-section">
        <div class="section-header">
            <h2><i class="fas fa-tractor"></i> Record Harvest</h2>
        </div>
        <form class="record-harvest-form" id="recordHarvestForm">
            <div class="form-group">
                <label for="harvest_date">Actual Harvest Date</label>
                <input type="date" id="harvest_date" required />
            </div>
            <div class="form-group">
                <label for="quantity">Quantity (in kg)</label>
                <input type="number" step="0.01" id="quantity" placeholder="e.g., 9500.50" required />
            </div>
            <div class="form-group">
                <label for="quality_grade">Quality Grade</label>
                <select id="quality_grade" required>
                    <option value="" disabled selected>Select a grade</option>
                    <option value="Grade A">Grade A (Premium)</option>
                    <option value="Grade B">Grade B (Standard)</option>
                    <option value="Grade C">Grade C (Sub-standard)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="storage_status">Storage Status</label>
                <select id="storage_status" required>
                    <option value="" disabled selected>Select a status</option>
                    <option value="In Warehouse">In Warehouse</option>
                    <option value="At Farm">At Farm</option>
                    <option value="Sold Immediately">Sold Immediately</option>
                </select>
            </div>
            <div class="form-group">
                <label for="storage_location">Storage Location</label>
                <input type="text" id="storage_location" placeholder="e.g., Local Co-op Warehouse" required />
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Save Harvest Record</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- 1. HANDLE LOGIN STATE & GET IDs ---
        const officerString = sessionStorage.getItem('loggedInOfficer');
        if (officerString) {
            document.getElementById('userName').textContent = JSON.parse(officerString).name;
        } else {
            alert("You are not logged in.");
            window.location.href = 'login.html';
            return;
        }

        const selectedCropPlanId = sessionStorage.getItem('selectedCropPlanId');
        if (!selectedCropPlanId) {
            alert("No crop plan selected for harvest. Returning to profile.");
            window.location.href = 'farmer-profile.html';
            return;
        }

        // --- 2. FORM SUBMISSION HANDLER ---
        const recordHarvestForm = document.getElementById("recordHarvestForm");
        recordHarvestForm.addEventListener("submit", async function(event) {
            event.preventDefault();
           // --- THIS IS THE FIX ---
            // 1. Get the date value from the input field.
            const harvestDateValue = document.getElementById('harvest_date').value;

            // 2. Add a validation check to ensure the date is not empty.
            if (!harvestDateValue) {
                alert("Please select a valid Harvest Date.");
                return; // Stop the submission if the date is empty.
            }
            // Build the Harvest object from the form data
            const harvestData = {
                harvestDate: harvestDateValue,
                quantity: parseFloat(document.getElementById('quantity').value),
                quality_grade: document.getElementById('quality_grade').value,
                storage_status: document.getElementById('storage_status').value,
                storage_location: document.getElementById('storage_location').value
            };

            try {
                const response = await fetch(`/api/harvests/record?cropPlanId=${selectedCropPlanId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(harvestData)
                });

                if (response.ok) {
                    alert("Harvest has been successfully recorded!");
                    // Set the refresh flag for the profile page
                    sessionStorage.setItem('profileNeedsRefresh', 'true');
                    // Redirect back to the farmer's profile page
                    window.location.href = "farmer-profile.html";
                } else {
                    const errorMessage = await response.text();
                    alert(`Failed to record harvest: ${errorMessage}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while saving the harvest record.');
            }
        });
    });
</script>
</body>
</html>
